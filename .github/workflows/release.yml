name: Release

# Push a tag like v3.9.4 to build and publish a release. The tag must match the version in the code.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(PYTHONPATH=server python3 -c 'from snapgent_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION)')"
          if [ "$tag" != "$code" ]; then
            echo "Tag v$tag does not match the version in the code ($code)." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  extension:
    needs: check-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
          if-no-files-found: error

  windows-binaries:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - run: python -m unittest discover -s tests -t .
      - run: pyinstaller --noconfirm bridge.spec
        working-directory: server
      - run: pyinstaller --noconfirm vscode_mcp.spec
        working-directory: server
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            server/dist/bridge.exe
            server/dist/vscode_mcp.exe
          if-no-files-found: error

  publish:
    needs: [check-version, extension, windows-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: extension-dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: binaries
      - name: Assemble the release
        run: >
          python3 scripts/package_release.py
          --version "${{ needs.check-version.outputs.version }}"
          --extension-dist extension-dist
          --binaries binaries
          --out out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "out/snapgent-v${{ needs.check-version.outputs.version }}.zip" \
            --title "snapgentV3 ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md --verify-tag
