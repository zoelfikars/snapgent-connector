name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Both browsers were built
        run: test -f dist/chrome/manifest.json && test -f dist/firefox/manifest.json

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.14"]
        exclude:
          # Keep the matrix small: the oldest and newest on the other systems are enough.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install websockets
      - name: Configure git identity for the tests that make commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: python -m unittest discover -s tests -t . -v

  frozen:
    name: Windows program builds and starts
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - run: pyinstaller --noconfirm snapgent.spec
      - uses: actions/upload-artifact@v4
        with:
          name: snapgent-windows-example
          path: server/dist/snapgent.exe
          retention-days: 7
          if-no-files-found: error
      - name: snapgent.exe answers as the VS Code MCP server
        shell: python
        run: |
          import json, subprocess
          request = json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {}}) + "\n"
          out = subprocess.run(["dist/snapgent.exe", "--vscode-mcp"], input=request, capture_output=True, text=True, timeout=60).stdout
          assert json.loads(out.splitlines()[0])["result"]["serverInfo"]["name"] == "vscode-mcp", out
      - name: snapgent.exe starts the bridge, writes its configuration and listens; a second start replaces it
        shell: python
        run: |
          import json, os, socket, subprocess, time
          env = dict(os.environ, ZS_BRIDGE_PORT="17998")
          def listening():
              for _ in range(100):
                  try:
                      socket.create_connection(("127.0.0.1", 17998), timeout=0.5).close(); return True
                  except OSError:
                      time.sleep(0.2)
              return False
          def start():
              return subprocess.Popen(["dist/snapgent.exe"], env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          first = start()
          assert listening(), "snapgent.exe never listened"
          assert json.load(open("dist/config.json"))["mcpServers"]["vscode"]["args"] == ["--vscode-mcp"]
          second = start()
          for _ in range(50):
              if first.poll() is not None:
                  break
              time.sleep(0.2)
          else:
              subprocess.run(["taskkill", "/F", "/T", "/PID", str(second.pid)])
              subprocess.run(["taskkill", "/F", "/T", "/PID", str(first.pid)])
              raise SystemExit("the first bridge was not replaced")
          assert listening(), "the second bridge never listened"
          subprocess.run(["taskkill", "/F", "/T", "/PID", str(second.pid)])

  frozen-linux:
    name: Linux program builds and starts
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller websockets
      - run: pyinstaller --noconfirm snapgent.spec
      - name: It answers as the VS Code MCP server
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 30 ./dist/snapgent --vscode-mcp | grep -q '"serverInfo"'
      - name: It starts the bridge, writes its configuration and listens; a second start replaces it
        run: |
          export ZS_BRIDGE_PORT=17999
          listening() { for _ in $(seq 1 50); do (exec 3<>/dev/tcp/127.0.0.1/17999) 2>/dev/null && return 0; sleep 0.2; done; return 1; }
          ./dist/snapgent </dev/null >first.log 2>&1 &
          first=$!
          listening
          grep -q '"--vscode-mcp"' dist/config.json
          ./dist/snapgent </dev/null >second.log 2>&1 &
          second=$!
          for _ in $(seq 1 50); do kill -0 "$first" 2>/dev/null || break; sleep 0.2; done
          if kill -0 "$first" 2>/dev/null; then echo "the first bridge was not replaced"; cat first.log second.log; exit 1; fi
          listening
          kill "$second"
